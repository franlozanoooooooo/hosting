<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuera de juego · Club Atlético Antoniano</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <style>
    @font-face{font-family:'Anton';font-style:normal;font-weight:400;font-display:swap;src:url('/assets/fonts/anton-400.woff2') format('woff2')}
    @font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;src:url('/assets/fonts/barlow-400.woff2') format('woff2')}
    @font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;src:url('/assets/fonts/barlow-700.woff2') format('woff2')}
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;
      gap:1.2rem;text-align:center;padding:2rem;
      font-family:'Barlow',Arial,sans-serif;color:#fff;
      background:radial-gradient(70% 90% at 50% 120%,rgba(228,37,28,.35),transparent 70%),#0A0A0B;
    }
    img{width:120px;height:auto}
    h1{font-family:'Anton',sans-serif;font-weight:400;font-size:clamp(2.6rem,9vw,5rem);text-transform:uppercase;line-height:1}
    h1 span{color:#E4251C}
    p{color:#A9A9B2;max-width:30rem}
    a{
      display:inline-flex;align-items:center;gap:.5rem;margin-top:1rem;min-height:48px;
      padding:.85rem 1.9rem;background:#C8102E;color:#fff;text-decoration:none;
      font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:.9rem;
      transition:background .2s,transform .2s;
    }
    a:hover{background:#9E0C24;transform:translateY(-2px)}
  </style>
</head>
<body>
  <img src="/assets/escudo.svg" alt="Escudo del Club Atlético Antoniano">
  <h1>Fuera de <span>juego</span></h1>
  <p>La página que buscas no existe o ha cambiado de sitio. Vuelve al inicio y sigue animando al Antoniano.</p>
  <a href="/">Volver al inicio</a>
</body>
</html>
