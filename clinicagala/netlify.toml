# Configuración para desplegar en Netlify
# Arrastra la carpeta (o el .zip con estos archivos en la raíz) a Netlify,
# o conéctalo por Git apuntando el "publish directory" a esta carpeta.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
