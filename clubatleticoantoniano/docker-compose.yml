# Postgres + Adminer para desarrollo local.
#   docker compose up -d
# DATABASE_URL sugerida en .env:
#   postgresql://caa:caa@localhost:5432/caa?schema=public
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: caa
      POSTGRES_PASSWORD: caa
      POSTGRES_DB: caa
    ports:
      - "5432:5432"
    volumes:
      - caa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caa"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      - db

volumes:
  caa_pgdata:
